services:
  - type: web
    name: cinco-centavos-api
    runtime: python
    plan: 0.5c-512mb
    region: ohio
    buildCommand: 'pip install -e . "uvicorn[standard]==0.54.0"'
    startCommand: 'PYTHONPATH=src uvicorn cinco_centavos.api.main:app --host 0.0.0.0 --port $PORT'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: PYTHONPATH
        value: src
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cinco-centavos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://5-centavos.vercel.app,http://localhost:8501,http://localhost:3000,http://localhost:8080
      - key: RUN_ETL
        value: "false"

databases:
  - name: cinco-centavos-db
    postgresMajorVersion: "16"
    databaseName: five_centavos
    user: cinco_centavos
    plan: 0.1c-256mb
    region: ohio
