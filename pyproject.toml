[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinco-centavos"
version = "1.1.0"
description = "Plataforma de gestão financeira pessoal com Analytics e IA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Danilo Almeida Lopes" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.vercel]
# Forçando atualização do deploy
entrypoint = "src.cinco_centavos.api.main:app"


